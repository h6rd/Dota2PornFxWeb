<div id="localeOverlay" class="info-overlay"></div>
<div id="localeModal" class="info-modal lc-modal">
  <button class="tools-back" data-tools-back aria-label="Back to tools" title="Back to tools">
    <span class="material-symbols-rounded">arrow_back</span>
  </button>
  <button class="info-modal-close" id="closeLocaleModal" aria-label="Close">
    <span class="material-symbols-rounded">close</span>
  </button>
  <div class="lc-inner">
    <div class="lc-head">
      <h2 class="info-modal-title">Localization Editor</h2>
      <p class="lc-status" id="lcStatus"></p>
    </div>

    <div class="lc-bar" id="lcBar">
      <div class="lc-field"><span>Language</span><select id="lcLang" class="settings-select"
          aria-label="Language"></select></div>
      <div class="lc-field"><span>File</span><select id="lcFile" class="settings-select" aria-label="File"></select>
      </div>
      <input type="search" id="lcSearch" class="lc-search" placeholder="Search by key or text…" autocomplete="off">
      <label class="lc-check"><input type="checkbox" id="lcOnlyMod"> Changed only</label>
    </div>

    <div class="lc-saved" id="lcSaved" hidden><span>Saved:</span><span id="lcSavedList"></span></div>
    <div class="lc-banner" id="lcBanner" hidden>
      <span id="lcBannerText"></span>
      <button type="button" class="lc-btn tonal" id="lcUpdate">Update my file</button>
    </div>

    <div class="lc-list" id="lcList"></div>

    <div class="lc-footer">
      <span class="lc-count" id="lcCount"></span>
      <span class="grow"></span>
      <button type="button" class="lc-btn tonal" id="lcReset" disabled>Reset file</button>
      <label>VPK <input type="text" id="lcPak" class="lc-pak" inputmode="numeric" maxlength="2" autocomplete="off"
          spellcheck="false" value="03"></label>
      <button type="button" class="lc-btn" id="lcBuild">Build VPK</button>
    </div>
  </div>
</div>
