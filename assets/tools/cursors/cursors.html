<div id="cursorOverlay" class="info-overlay"></div>
<div id="cursorModal" class="info-modal cr-modal">
  <button class="tools-back" data-tools-back aria-label="Back to tools" title="Back to tools">
    <span class="material-symbols-rounded">arrow_back</span>
  </button>
  <button class="info-modal-close" id="closeCursorModal" aria-label="Close">
    <span class="material-symbols-rounded">close</span>
  </button>
  <div class="cr-head">
    <h2 class="info-modal-title">Cursor Creator</h2>
  </div>
  <div class="cr-body">
    <aside class="cr-col">
      <div class="cr-list-head"><span>Cursors</span><span id="crCount">0 / 15</span></div>
      <div class="cr-list" id="crList"></div>
    </aside>

    <section class="cr-col cr-col-fixed">
      <div class="cr-editor" id="crEditor">
        <div class="cr-editor-head">
          <span class="cr-editor-title" id="crTitle"></span>
        </div>
        <div class="cr-row">
          <button type="button" class="cr-btn primary" id="crChoose"><span
              class="material-symbols-rounded">image</span>Choose image</button>
          <button type="button" class="cr-btn" id="crReset"><span
              class="material-symbols-rounded">restart_alt</span>Reset</button>
          <button type="button" class="cr-btn" id="crRemove"><span
              class="material-symbols-rounded">delete</span>Remove</button>
          <button type="button" class="cr-btn" id="crImgAll"><span
              class="material-symbols-rounded">collections</span>One image for all</button>
        </div>
        <div class="cr-controls">
          <div class="cr-slider">
            <span class="material-symbols-rounded">zoom_in</span>
            <input type="range" id="crScale" min="10" max="400" value="100" step="1">
            <output id="crScaleVal">100%</output>
          </div>
          <div class="cr-slider">
            <span class="material-symbols-rounded">rotate_right</span>
            <input type="range" id="crRot" min="-180" max="180" value="0" step="1">
            <output id="crRotVal">0°</output>
          </div>
        </div>
        <div class="cr-stage-wrap">
          <div class="cr-stage empty" id="crStage">
            <canvas id="crCanvas" width="512" height="512"></canvas>
            <div class="cr-grid"></div>
            <div class="cr-empty">
              <span class="material-symbols-rounded">add_photo_alternate</span>
              <span>Click or drop an image</span>
            </div>
          </div>
        </div>
        <div class="cr-ghost-row">
          <label class="settings-toggle-label">
            <span class="cr-ghost-text"><strong>Show original cursor</strong><small>Faded guide for size and
                position.</small></span>
            <input type="checkbox" id="crGhostToggle" class="settings-toggle-input" checked>
            <span class="settings-toggle-track"></span>
          </label>
        </div>
        <input type="file" id="crFile" accept="image/*" hidden>
        <input type="file" id="crAllFile" accept="image/*" hidden>
      </div>
    </section>

    <aside class="cr-col cr-col-side">
      <div class="cr-card grow-a">
        <h3>Preview</h3>
        <div class="cr-test" id="crTest">
          <span class="cr-test-hint">Hover over this area to preview the selected cursor</span>
        </div>
      </div>
      <div class="cr-card grow-b">
        <h3>Activity</h3>
        <div class="upload-preview-log-body cr-log" id="crLog"></div>
      </div>
    </aside>
  </div>
  <div class="cr-foot">
    <div class="cr-name">
      <label for="crName">Name</label>
      <input type="text" id="crName" maxlength="48" value="My Cursor" placeholder="My Cursor">
    </div>
    <div class="cr-status" id="crStatus"></div>
    <div class="cr-result" id="crResult">
      <span class="material-symbols-rounded">check_circle</span>
      <div><strong id="crResultText"></strong>Unpack and run Install.bat</div>
      <button type="button" class="cr-btn primary" id="crDownload"><span
          class="material-symbols-rounded">download</span>Download</button>
    </div>
    <button type="button" class="cr-btn primary" id="crGenerate" disabled><span
        class="material-symbols-rounded">folder_zip</span>Create archive</button>
  </div>
</div>
