name: Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: '0 4 * * 0'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: main-pipeline
  cancel-in-progress: false

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest

    outputs:
      files: ${{ steps.changes.outputs.files }}
      data: ${{ steps.changes.outputs.data }}
      publish_code: ${{ steps.changes.outputs.publish_code }}
      site: ${{ steps.changes.outputs.site }}
      full_rehash: ${{ steps.changes.outputs.full_rehash }}
      base_sha: ${{ steps.changes.outputs.base_sha }}
      head_sha: ${{ steps.changes.outputs.head_sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            /*
            !assets/files
          sparse-checkout-cone-mode: false

      - name: Detect changed files
        id: changes
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            echo "files=true" >> "$GITHUB_OUTPUT"
            echo "data=true" >> "$GITHUB_OUTPUT"
            echo "site=true" >> "$GITHUB_OUTPUT"
            echo "full_rehash=true" >> "$GITHUB_OUTPUT"
            echo "base_sha=" >> "$GITHUB_OUTPUT"
            echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE_SHA" 2>/dev/null; then
            echo "::warning::No usable 'before' SHA (new branch, force-push, or truncated history) - comparing against HEAD^ only"
            BASE_SHA=$(git rev-parse HEAD^)
          fi

          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "full_rehash=false" >> "$GITHUB_OUTPUT"

          CHANGED=$(git -c core.quotepath=false diff --name-only "$BASE_SHA" "$HEAD_SHA")

          if echo "$CHANGED" | grep -q -E '^assets/files/|^assets/previews/|^assets/data/mods\.json$|^assets/data/announcements\.json$'; then
            echo "files=true" >> "$GITHUB_OUTPUT"
          else
            echo "files=false" >> "$GITHUB_OUTPUT"
          fi

          if echo "$CHANGED" | grep -q '^assets/data/.*\.json$'; then
            echo "data=true" >> "$GITHUB_OUTPUT"
          else
            echo "data=false" >> "$GITHUB_OUTPUT"
          fi

          if echo "$CHANGED" | grep -q -E '^(scripts/generate_data\.py|\.github/workflows/publish-data\.yml)$'; then
            echo "publish_code=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish_code=false" >> "$GITHUB_OUTPUT"
          fi

          NON_SITE='^(assets/data/|assets/files/|assets/signatures/|scripts/|\.github/|[^/]+\.md$|LICENSE$|\.git(ignore|attributes)$)'
          FORCE_SITE='^(\.github/workflows/deploy\.yml|scripts/generate-seo\.mjs|scripts/minify-dist\.mjs)$'

          if echo "$CHANGED" | grep -v -E "$NON_SITE" | grep -q . || echo "$CHANGED" | grep -q -E "$FORCE_SITE"; then
            echo "site=true" >> "$GITHUB_OUTPUT"
          else
            echo "site=false" >> "$GITHUB_OUTPUT"
          fi

  catalog:
    name: Update catalog
    needs: changes
    if: needs.changes.outputs.files == 'true'

    uses: ./.github/workflows/update-catalog.yml
    with:
      full_rehash: ${{ needs.changes.outputs.full_rehash == 'true' }}
      base_sha: ${{ needs.changes.outputs.base_sha }}
      head_sha: ${{ needs.changes.outputs.head_sha }}

    secrets: inherit

  signatures:
    name: Sign catalog
    needs:
      - changes
      - catalog

    if: |
      always() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.files != 'true' &&
      needs.changes.outputs.data == 'true'

    uses: ./.github/workflows/sign-catalog.yml

    secrets: inherit

  huggingface:
    name: Sync to Hugging Face
    needs:
      - changes
      - catalog
      - signatures

    if: |
      always() &&
      needs.changes.result == 'success' &&
      (
        needs.changes.outputs.files == 'true' ||
        needs.changes.outputs.data == 'true'
      ) &&
      needs.catalog.result != 'failure' &&
      needs.catalog.result != 'cancelled' &&
      needs.signatures.result != 'failure' &&
      needs.signatures.result != 'cancelled'

    uses: ./.github/workflows/sync-huggingface.yml
    with:
      full_sync: ${{ needs.changes.outputs.full_rehash == 'true' }}
      base_sha: ${{ needs.changes.outputs.base_sha }}

    secrets: inherit

  publish_data:
    name: Publish compressed data
    needs:
      - changes
      - catalog
      - signatures

    if: |
      always() &&
      needs.changes.result == 'success' &&
      (
        needs.changes.outputs.files == 'true' ||
        needs.changes.outputs.data == 'true' ||
        needs.changes.outputs.publish_code == 'true'
      ) &&
      needs.catalog.result != 'failure' &&
      needs.catalog.result != 'cancelled' &&
      needs.signatures.result != 'failure' &&
      needs.signatures.result != 'cancelled'

    uses: ./.github/workflows/publish-data.yml

    secrets: inherit

  deploy:
    name: Deploy
    needs:
      - changes
      - catalog
      - signatures

    if: |
      always() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.site == 'true' &&
      needs.catalog.result != 'failure' &&
      needs.catalog.result != 'cancelled' &&
      needs.signatures.result != 'failure' &&
      needs.signatures.result != 'cancelled'

    uses: ./.github/workflows/deploy.yml

    secrets: inherit

  notify:
    name: Discord notification
    needs:
      - changes
      - catalog
      - signatures
      - publish_data
      - deploy

    if: |
      always() &&
      github.event_name == 'push' &&
      needs.changes.result == 'success' &&
      needs.catalog.result != 'failure' &&
      needs.catalog.result != 'cancelled' &&
      needs.signatures.result != 'failure' &&
      needs.signatures.result != 'cancelled' &&
      needs.publish_data.result != 'failure' &&
      needs.publish_data.result != 'cancelled' &&
      needs.deploy.result != 'failure' &&
      needs.deploy.result != 'cancelled'

    uses: ./.github/workflows/discord.yml
    with:
      base_sha: ${{ needs.changes.outputs.base_sha }}
      head_sha: ${{ needs.changes.outputs.head_sha }}

    secrets: inherit
