name: Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: main-pipeline
  cancel-in-progress: false

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest

    outputs:
      files: ${{ steps.changes.outputs.files }}
      data: ${{ steps.changes.outputs.data }}
      full_rehash: ${{ steps.changes.outputs.full_rehash }}
      base_sha: ${{ steps.changes.outputs.base_sha }}
      head_sha: ${{ steps.changes.outputs.head_sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            /*
            !assets/files
          sparse-checkout-cone-mode: false

      - name: Detect changed files
        id: changes
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "files=true" >> "$GITHUB_OUTPUT"
            echo "data=true" >> "$GITHUB_OUTPUT"
            echo "full_rehash=true" >> "$GITHUB_OUTPUT"
            echo "base_sha=" >> "$GITHUB_OUTPUT"
            echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE_SHA" 2>/dev/null; then
            echo "::warning::No usable 'before' SHA (new branch, force-push, or truncated history) - comparing against HEAD^ only"
            BASE_SHA=$(git rev-parse HEAD^)
          fi

          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "full_rehash=false" >> "$GITHUB_OUTPUT"

          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -q -E '^assets/files/|^assets/previews/|^assets/data/mods\.json$|^assets/data/announcements\.json$'; then
            echo "files=true" >> "$GITHUB_OUTPUT"
          else
            echo "files=false" >> "$GITHUB_OUTPUT"
          fi

          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -q '^assets/data/.*\.json$'; then
            echo "data=true" >> "$GITHUB_OUTPUT"
          else
            echo "data=false" >> "$GITHUB_OUTPUT"
          fi

  catalog:
    name: Update catalog
    needs: changes
    if: needs.changes.outputs.files == 'true'

    uses: ./.github/workflows/update-catalog.yml
    with:
      full_rehash: ${{ needs.changes.outputs.full_rehash == 'true' }}
      base_sha: ${{ needs.changes.outputs.base_sha }}
      head_sha: ${{ needs.changes.outputs.head_sha }}

    secrets: inherit

  signatures:
    name: Sign catalog
    needs:
      - changes
      - catalog

    if: |
      needs.changes.outputs.files != 'true' &&
      needs.changes.outputs.data == 'true'

    uses: ./.github/workflows/sign-catalog.yml

    secrets: inherit

  deploy:
    name: Deploy
    needs:
      - changes
      - catalog
      - signatures

    if: |
      always() &&
      needs.changes.result == 'success' &&
      (
        (
          needs.changes.outputs.files == 'true' &&
          needs.catalog.result == 'success'
        )
        ||
        (
          needs.changes.outputs.files != 'true' &&
          needs.changes.outputs.data == 'true' &&
          needs.signatures.result == 'success'
        )
        ||
        (
          needs.changes.outputs.files != 'true' &&
          needs.changes.outputs.data != 'true'
        )
      )

    uses: ./.github/workflows/deploy.yml

    secrets: inherit
