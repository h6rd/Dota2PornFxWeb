name: Update project activity

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: project-activity
  cancel-in-progress: false

jobs:
  activity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main (history only)
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            /*
            !assets/files
          sparse-checkout-cone-mode: false

      - name: Generate activity.svg
        run: python3 scripts/make_activity.py --out .github/activity.svg

      - name: Commit and push to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/activity.svg
          if git diff --cached --quiet; then
            echo "Activity unchanged"
            exit 0
          fi

          git commit -m "chore: update project activity [skip ci]"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push failed (attempt $attempt), rebasing onto main"
            git pull --rebase origin main
          done
          exit 1
