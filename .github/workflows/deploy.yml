name: Deploy to GitHub Pages

on:
  workflow_call:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            /*
            !assets/files
          sparse-checkout-cone-mode: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ vars.PYTHON_VERSION || '3.11' }}

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Generate Compressed Data
        run: python scripts/generate_data.py

      - name: Deploy Data to data branch
        uses: peaceiris/actions-gh-pages@373f7f263a76c20808c831209c920827a82a2847
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./compressed
          publish_branch: data

      - name: Prepare dist folder
        run: |
          rsync -a \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.github' \
            --exclude='assets/files' \
            --exclude='compressed' \
            . dist/

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ vars.NODE_VERSION || '24' }}

      - name: Minify HTML, CSS, and JS
        run: |
          npm install --no-audit --no-fund esbuild html-minifier-terser
          node scripts/minify-dist.mjs dist

      - name: Show build summary
        run: |
          echo "===== BUILD SUMMARY ====="
          du -sh dist/
          echo "========================="

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4