name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            /*
            !assets/files
          sparse-checkout-cone-mode: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Generate Metadata
        run: python scripts/add_meta.py

      - name: Commit and Push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/mods.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update mods metadata [skip ci]"
            git push
          fi

      - name: Generate Compressed Data
        run: python scripts/generate_data.py

      - name: Deploy Data to data branch
        uses: peaceiris/actions-gh-pages@373f7f263a76c20808c831209c920827a82a2847 # v3.9.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./compressed
          publish_branch: data

      - name: Prepare dist folder
        run: |
          rsync -a \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.github' \
            --exclude='assets/files' \
            --exclude='compressed' \
            . dist/

      - name: Minify HTML, CSS, and JS
        run: |
          npm install -g esbuild html-minifier-terser
          find dist -type f \( -name "*.js" -o -name "*.css" -o -name "*.html" \) | while read -r file; do
            if [[ "$file" == *"assets/m3e"* ]] || [[ "$file" == *"assets/lz-string.min.js" ]] || [[ "$file" == *"assets/zip.min.js" ]]; then
              echo "skip: $file"
              continue
            fi
            
            echo "Minification: $file"
            if [[ "$file" == *.html ]]; then
              html-minifier-terser --collapse-whitespace --remove-comments --minify-css true --minify-js true "$file" -o "$file"
            else
              esbuild "$file" --minify --allow-overwrite --outfile="$file"
            fi
          done

      - name: Show build summary
        run: |
          echo "===== BUILD SUMMARY ====="
          du -sh dist/
          echo "========================="

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4