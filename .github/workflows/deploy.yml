name: Deploy to GitHub Pages

on:
  workflow_call:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            /*
            !assets/files
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ vars.NODE_VERSION || '24' }}

      - name: Generate SEO pages and sitemap
        run: node scripts/generate-seo.mjs

      - name: Prepare dist folder
        run: |
          rsync -a \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.github' \
            --exclude='assets/files' \
            --exclude='compressed' \
            . dist/

      - name: Minify HTML, CSS, and JS
        run: |
          npm install --no-audit --no-fund esbuild html-minifier-terser
          node scripts/minify-dist.mjs dist

      - name: Show build summary
        run: |
          echo "===== BUILD SUMMARY ====="
          du -sh dist/
          echo "========================="

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish dist to mirror branch
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@373f7f263a76c20808c831209c920827a82a2847
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: mirror
          force_orphan: true
          disable_nojekyll: true
          user_name: ${{ vars.MIRROR_COMMIT_NAME || 'github-actions[bot]' }}
          user_email: ${{ vars.MIRROR_COMMIT_EMAIL || '41898282+github-actions[bot]@users.noreply.github.com' }}
          commit_message: "mirror: ${{ github.sha }}"

      - name: Commit sitemap to main
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore index.html
          git add sitemap.xml
          if git diff --cached --quiet; then
            echo "Sitemap unchanged"
          else
            git commit -m "chore: update sitemap [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
