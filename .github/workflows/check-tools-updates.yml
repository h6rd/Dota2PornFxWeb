name: Check Tool Updates

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: check-tool-updates
  cancel-in-progress: false

jobs:
  check-updates:
    runs-on: ubuntu-latest

    outputs:
      base_sha: ${{ steps.base.outputs.sha }}
      changed: ${{ steps.push.outputs.changed }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.DEPLOY_PAT }}
          sparse-checkout: |
            /*
            !assets/files
          sparse-checkout-cone-mode: false

      - name: Remember base commit
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ vars.PYTHON_VERSION || '3.11' }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ vars.NODE_VERSION || '24' }}

      - name: Check for version updates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/check_tools_updates.py

      - name: Sign catalog data
        env:
          CATALOG_PRIVATE_KEY: ${{ secrets.CATALOG_PRIVATE_KEY }}
        run: node scripts/sign-catalog.mjs

      - name: Commit and push changes
        id: push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/mods.json assets/data/tool-versions.json assets/signatures/
          if git diff --staged --quiet; then
            echo "Nothing to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update tool versions [skip ci]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  sync-hf:
    name: Sync to Hugging Face
    needs: check-updates
    if: needs.check-updates.outputs.changed == 'true'

    uses: ./.github/workflows/sync-huggingface.yml
    with:
      base_sha: ${{ needs.check-updates.outputs.base_sha }}

    secrets: inherit