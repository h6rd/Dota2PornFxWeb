name: Publish compressed data

on:
  workflow_call:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !assets/files
            !assets/previews
          sparse-checkout-cone-mode: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ vars.PYTHON_VERSION || '3.11' }}

      - name: Generate Compressed Data
        run: python scripts/generate_data.py

      - name: Deploy Data to data branch
        uses: peaceiris/actions-gh-pages@373f7f263a76c20808c831209c920827a82a2847
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./compressed
          publish_branch: data

      - name: Sync data branch to Hugging Face
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: ${{ vars.HF_REPO_ID }}
          HF_REPO_TYPE: ${{ vars.HF_REPO_TYPE || 'dataset' }}
          HF_DATA_BRANCH: ${{ vars.HF_DATA_BRANCH || 'data' }}
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
        run: |
          pip install -U huggingface_hub
          python - <<'PY'
          import os
          from pathlib import Path

          from huggingface_hub import CommitOperationAdd, CommitOperationDelete, HfApi

          repo = os.environ["HF_REPO_ID"]
          repo_type = os.environ["HF_REPO_TYPE"]
          branch = os.environ["HF_DATA_BRANCH"]
          sha = os.environ["GITHUB_SHA"][:7]
          api = HfApi(token=os.environ["HF_TOKEN"])

          local = {
              p.relative_to("compressed").as_posix(): p
              for p in Path("compressed").rglob("*")
              if p.is_file()
          }
          if not local:
              raise SystemExit("::error::compressed/ is empty - refusing to wipe the data branch")

          api.create_branch(repo_id=repo, repo_type=repo_type, branch=branch, exist_ok=True)

          remote = set(api.list_repo_files(repo_id=repo, repo_type=repo_type, revision=branch))
          stale = sorted(f for f in remote - set(local) if f != ".gitattributes")

          operations = [CommitOperationDelete(path_in_repo=f) for f in stale]
          operations += [CommitOperationAdd(path_in_repo=k, path_or_fileobj=str(v)) for k, v in sorted(local.items())]
          api.create_commit(
              repo_id=repo,
              repo_type=repo_type,
              revision=branch,
              operations=operations,
              commit_message=f"Sync compressed data from GitHub {sha}",
          )
          print(f"{branch}: uploaded {len(local)} files, removed {len(stale)}")

          PY