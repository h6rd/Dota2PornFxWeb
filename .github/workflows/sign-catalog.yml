name: Sign catalog

on:
  workflow_call:

permissions:
  contents: write

jobs:
  sign:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            /*
            !assets/files
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ vars.NODE_VERSION || '24' }}

      - name: Sign catalog data
        env:
          CATALOG_PRIVATE_KEY: ${{ secrets.CATALOG_PRIVATE_KEY }}
        run: node scripts/sign-catalog.mjs

      - name: Commit and Push signatures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/signatures/

          if git diff --cached --quiet; then
            echo "Signatures unchanged"
          else
            git commit -m "chore: update catalog signatures [skip ci]"
            git push
          fi