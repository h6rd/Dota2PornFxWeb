name: Update catalog

on:
  workflow_call:

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            /*
            !assets/files
          sparse-checkout-cone-mode: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Metadata
        run: python scripts/add_meta.py

      - name: Stamp announcements
        run: python scripts/set_announcement_times.py

      - name: Generate hashes
        run: |
          python3 <<'PY'
          import hashlib
          import json
          import subprocess
          import sys
          from pathlib import Path

          files_dir = Path("assets/files")
          output_file = Path("assets/data/mod-hashes.json")

          hashes = {}
          if output_file.exists():
              try:
                  with output_file.open("r", encoding="utf-8") as f:
                      hashes = json.load(f)
              except Exception:
                  hashes = {}

          cmd = ["git", "diff", "--name-status", "-M", "-z", "HEAD^", "HEAD", "--", "assets/files/"]
          res = subprocess.run(cmd, capture_output=True, text=True, check=True)

          fields = res.stdout.split("\0")
          # -z output is NUL-terminated, so the split leaves a trailing ""
          if fields and fields[-1] == "":
              fields.pop()

          changed_files = set()
          deleted_files = set()

          i = 0
          while i < len(fields):
              status = fields[i]
              if status.startswith("R") or status.startswith("C"):
                  old_path, new_path = fields[i + 1], fields[i + 2]
                  i += 3
                  deleted_files.add(Path(old_path).relative_to(files_dir).as_posix())
                  changed_files.add(Path(new_path).relative_to(files_dir).as_posix())
              else:
                  path_str = fields[i + 1]
                  i += 2
                  rel_path = Path(path_str).relative_to(files_dir).as_posix()
                  if status.startswith("D"):
                      deleted_files.add(rel_path)
                  else:
                      changed_files.add(rel_path)

          for rel_path in deleted_files:
              hashes.pop(rel_path, None)

          changed_list = sorted(changed_files)
          failed = []

          if changed_list:
              requests = [f"HEAD:{files_dir.as_posix()}/{rel_path}\n" for rel_path in changed_list]

              proc = subprocess.run(
                  ["git", "cat-file", "--batch"],
                  input="".join(requests).encode(),
                  capture_output=True,
                  check=False,
              )

              data = proc.stdout
              pos = 0

              for idx, rel_path in enumerate(changed_list):
                  try:
                      nl = data.index(b"\n", pos)
                      header = data[pos:nl].decode("utf-8", errors="replace")
                      pos = nl + 1

                      if header.endswith(" missing"):
                          raise ValueError(f"blob missing ({header!r})")

                      oid, obj_type, size_str = header.split()
                      size = int(size_str)
                      content = data[pos:pos + size]
                      pos += size + 1
                  except (ValueError, IndexError) as exc:
                      failed.extend(changed_list[idx:])
                      print(
                          f"::error::git cat-file --batch parsing failed at "
                          f"{rel_path!r}: {exc}",
                          file=sys.stderr,
                      )
                      break

                  hashes[rel_path] = hashlib.sha256(content).hexdigest()

              if proc.returncode != 0 and not failed:
                  stderr_text = proc.stderr.decode(errors="replace").strip()
                  print(
                      f"::warning::git cat-file --batch exited {proc.returncode}: {stderr_text}",
                      file=sys.stderr,
                  )

          output_file.parent.mkdir(parents=True, exist_ok=True)

          with output_file.open("w", encoding="utf-8") as f:
              json.dump(hashes, f, ensure_ascii=False, indent=2, sort_keys=True)
              f.write("\n")

          if failed:
              print(f"::error::Failed to hash {len(failed)} file(s): {failed}")
              sys.exit(1)
          PY

      - name: Sign every data file
        env:
          CATALOG_PRIVATE_KEY: ${{ secrets.CATALOG_PRIVATE_KEY }}
        run: |
          if [ -z "$CATALOG_PRIVATE_KEY" ]; then
            echo "::error::CATALOG_PRIVATE_KEY is not set"
            exit 1
          fi

          node -e '
            const crypto = require("crypto");
            const fs = require("fs");
            const path = require("path");

            const key = crypto.createPrivateKey(
              process.env.CATALOG_PRIVATE_KEY
            );

            const dataDir = "assets/data";
            const sigDir = "assets/signatures";

            fs.mkdirSync(sigDir, { recursive: true });

            for (const name of fs.readdirSync(dataDir)) {
              if (!name.endsWith(".json")) continue;

              const file = path.join(dataDir, name);
              const sigFile = path.join(sigDir, name + ".sig");

              const sig = crypto.sign(
                null,
                fs.readFileSync(file),
                key
              );

              fs.writeFileSync(
                sigFile,
                sig.toString("base64") + "\n"
              );

              console.log("signed " + name);
            }
          '

      - name: Remove signatures for deleted JSON files
        run: |
          shopt -s nullglob

          for sig in assets/signatures/*.json.sig; do
            name=$(basename "$sig" .sig)

            if [ ! -f "assets/data/$name" ]; then
              echo "Removing obsolete signature: $sig"
              rm "$sig"
            fi
          done

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/data/mods.json assets/data/announcements.json assets/data/mod-hashes.json assets/data/constants.json assets/data/guides.json assets/signatures/

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update catalog data and signatures [skip ci]"
            git push
          fi