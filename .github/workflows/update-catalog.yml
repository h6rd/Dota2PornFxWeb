name: Update catalog

on:
  workflow_call:
    inputs:
      full_rehash:
        description: "Recompute hashes for every file in assets/files instead of diffing a commit range"
        type: boolean
        default: false
      base_sha:
        description: "Commit to diff from (ignored when full_rehash is true)"
        type: string
        default: ""
      head_sha:
        description: "Commit to diff to (ignored when full_rehash is true)"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            /*
            !assets/files
          sparse-checkout-cone-mode: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ vars.PYTHON_VERSION || '3.11' }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ vars.NODE_VERSION || '24' }}

      - name: Generate Metadata
        run: python scripts/add_meta.py

      - name: Stamp announcements
        run: python scripts/set_announcement_times.py

      - name: Generate hashes
        env:
          FULL_REHASH: ${{ inputs.full_rehash }}
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: python scripts/generate_mod_hashes.py

      - name: Sign catalog data
        env:
          CATALOG_PRIVATE_KEY: ${{ secrets.CATALOG_PRIVATE_KEY }}
        run: node scripts/sign-catalog.mjs

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/data/mods.json assets/data/announcements.json assets/data/mod-hashes.json assets/data/constants.json assets/data/guides.json assets/signatures/

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update catalog data and signatures [skip ci]"
            git push
          fi
