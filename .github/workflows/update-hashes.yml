name: Update mod hashes

on:
  workflow_call:

permissions:
  contents: write

jobs:
  hashes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
          filter: blob:none

      - name: Generate hashes
        run: |
          python3 <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          files_dir = Path("assets/files")
          output_file = Path("assets/data/mod-hashes.json")

          hashes = {}
          if output_file.exists():
              try:
                  with output_file.open("r", encoding="utf-8") as f:
                      hashes = json.load(f)
              except Exception:
                  hashes = {}

          cmd = ["git", "diff", "--name-status", "HEAD^", "HEAD", "--", "assets/files/"]
          res = subprocess.run(cmd, capture_output=True, text=True)

          changed_files = set()
          deleted_files = set()

          for line in res.stdout.strip().splitlines():
              if not line:
                  continue
              parts = line.split(maxsplit=1)
              status, path_str = parts[0], parts[1]
              rel_path = Path(path_str).relative_to(files_dir).as_posix()

              if status.startswith("D"):
                  deleted_files.add(rel_path)
              else:
                  changed_files.add(rel_path)

          for rel_path in deleted_files:
              hashes.pop(rel_path, None)

          for rel_path in changed_files:
              file = files_dir / rel_path
              if not file.is_file():
                  continue

              sha256 = hashlib.sha256()
              with file.open("rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      sha256.update(chunk)

              hashes[rel_path] = sha256.hexdigest()

          output_file.parent.mkdir(parents=True, exist_ok=True)

          with output_file.open("w", encoding="utf-8") as f:
              json.dump(
                  hashes,
                  f,
                  ensure_ascii=False,
                  indent=2,
                  sort_keys=True
              )
              f.write("\n")
          PY

      - name: Commit and Push hashes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/data/mod-hashes.json

          if git diff --staged --quiet; then
            echo "Hashes unchanged"
          else
            git commit -m "chore: update mod hashes [skip ci]"
            git push
          fi