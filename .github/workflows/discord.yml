name: Discord Webhook

on:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types:
      - completed

jobs:
  notify:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_commit.message, 'mods:')
    steps:
      - name: Pick GIF
        id: gif
        run: |
          GIFS=(
            "https://i.postimg.cc/B6vK2TkK/d2pfx-1.gif"
            "https://i.postimg.cc/cH58hKGt/d2pfx-2.gif"
            "https://i.postimg.cc/1tYNBg1n/d2pfx-3.gif"
          )
          INDEX=$(( ${{ github.run_number }} % ${#GIFS[@]} ))
          echo "url=${GIFS[$INDEX]}" >> $GITHUB_OUTPUT

      - name: Send discord notification
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            "content": null,
            "embeds": [
              {
                "title": "Changes",
                "description": "${{ github.event.workflow_run.head_commit.message }}\n\n[🌐 **Open Site**](https://h6rd.github.io/Dota2PornFxWeb/)",
                "color": 8585067,
                "image": {
                  "url": "${{ steps.gif.outputs.url }}"
                }
              },
              {
                "title": "Website Mirrors",
                "description": "If the main site is unavailable, you can use one of the mirrors below\n\n[**Codeberg**](https://hrdq.codeberg.page/Dota2PornFxWeb/) ✦ [**Netlify**](https://d2pfx.netlify.app/) ✦ [**Onrender**](https://d2pfx.onrender.com/) ✦ [**Vercel**](https://d2pfx.vercel.app/)",
                "color": 10054655,
                "footer": {
                  "text": "⚠️ Due to high load, some mirrors may be unavailable"
                }
              }
            ],
            "username": "Github",
            "avatar_url": "https://i.postimg.cc/zGJTFHyj/github.webp"
          }' \
          ${{ secrets.DISCORD_WEBHOOK_URL }}