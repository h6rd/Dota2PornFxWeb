name: Discord Webhook

on:
  workflow_call:
    inputs:
      base_sha:
        description: "Commit to diff from (state before the push)"
        type: string
        required: true
      head_sha:
        description: "Commit that was pushed"
        type: string
        required: true

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pushed commit
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            /*
            !assets/files
          sparse-checkout-cone-mode: false

      - name: Pick GIF
        id: gif
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          GIFS=(
            "https://i.postimg.cc/B6vK2TkK/d2pfx-1.gif"
            "https://i.postimg.cc/cH58hKGt/d2pfx-2.gif"
            "https://i.postimg.cc/1tYNBg1n/d2pfx-3.gif"
          )
          INDEX=$(( RUN_NUMBER % ${#GIFS[@]} ))
          echo "url=${GIFS[$INDEX]}" >> "$GITHUB_OUTPUT"

      - name: Build message from changes
        id: build
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
          GIF_URL: ${{ steps.gif.outputs.url }}
        run: python3 scripts/discord_changes.py --out discord_payload.json

      - name: Send discord notification
        if: steps.build.outputs.has_changes == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -sS --fail \
            -H "Content-Type: application/json" \
            -d @discord_payload.json \
            "$DISCORD_WEBHOOK_URL"