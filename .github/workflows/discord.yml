name: Discord Webhook

on:
  workflow_run:
    workflows: ["pages-build-deployment"]
    types:
      - completed

jobs:
  notify:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Send discord notification
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            "content": "✅ Site has been updated!",
            "embeds": [{
              "title": "New deployment",
              "description": "**${{ github.event.workflow_run.head_commit.message }}**\n\n[🌐 Open site](https://your-site.github.io) • [📝 View commit](https://github.com/${{ github.repository }}/commit/${{ github.event.workflow_run.head_sha }})",
              "color": 5763719
            }]
          }' \
          ${{ secrets.DISCORD_WEBHOOK_URL }}